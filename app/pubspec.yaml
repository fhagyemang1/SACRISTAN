name: sacristan
description: >
  SACRISTAN — an offline-first companion for Catholic sacristans: today's
  liturgical color/rank/season at a glance, Mass-prep checklists, vestment
  and vessel inventory, and an offline reference library. No account,
  no network required for any core feature.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  # 3.27+ because the UI code uses Color.withValues(alpha: ...) (the
  # replacement for the deprecated Color.withOpacity), which requires
  # Flutter 3.27 or newer. If you deliberately target an older Flutter,
  # either raise a lint warning suppression or revert those call sites to
  # .withOpacity() — search this repo for "withValues" to find them all.
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local calendar engine (pure Dart, this repo)
  liturgical_calendar:
    path: ../packages/liturgical_calendar

  # Local, offline SQLite data layer
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management (simple, low ceremony — appropriate for a small/volunteer team)
  provider: ^6.1.2

  # Local (device-only) notifications — no server-side push
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # SMS deep-link (opens the device's own Messages app pre-filled; no SMS gateway/account needed)
  url_launcher: ^6.3.0

  # Optional shopping-list export
  csv: ^6.0.0
  # Round 9's second real CI run failed "flutter pub get" here too: the
  # ^9.0.0 pin transitively needs `web ^0.5.0`, but `drift >=2.19.2`
  # (already required above) needs `web ^1.0.0` — incompatible. Bumped
  # to the exact version pub's own resolver suggested
  # (`flutter pub add share_plus:^13.3.0`) rather than guessed. The
  # `Share.shareXFiles(...)` call in inventory_screen.dart is deprecated
  # as of share_plus 11.0.0 but still present and functional through
  # 13.x — see the comment at that call site.
  share_plus: ^13.3.0

  # Icons/formatting
  # Pinned to what flutter_localizations (from the Flutter SDK itself)
  # requires, not chosen freely — round 9's first real CI run failed
  # "flutter pub get" with a version-solving error because this was
  # ^0.19.0 while the installed SDK's flutter_localizations demanded
  # intl ^0.20.3. If a future Flutter upgrade shifts that requirement
  # again, `flutter pub get`'s own error message names the exact
  # version to put here — this is not a value to guess at.
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

  # Salted-hash storage for the admin PIN (no plaintext PIN ever stored)
  crypto: ^3.0.5

  # Renders the bundled original SVG line-art in the Reference Library
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true # enables the l10n.yaml-driven ARB -> Dart codegen
  assets:
    - assets/reference/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: "assets/reference/app_icon_source.png"
